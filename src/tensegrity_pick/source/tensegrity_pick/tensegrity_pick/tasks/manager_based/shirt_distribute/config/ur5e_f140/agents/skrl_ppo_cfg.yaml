seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    # Determinism fix: the old profile (initial_log_std 0.0, max 2.0, entropy
    # bonus 0.005) left the action std pinned at ~0.96 for the whole run — the
    # policy became a saturated-noise controller (mean |action| ≈ 0.98) that
    # placed the shirt *stochastically* but did nothing with mean actions.
    # Start with moderate noise (std 0.6), cap it low, and let it anneal so the
    # deterministic mean absorbs the behaviour (deployment plays the mean).
    min_log_std: -3.0
    max_log_std: 0.5
    initial_log_std: -0.5
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 48
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.004
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  # 0.0 (was 0.005): the entropy bonus rewarded keeping the action std high,
  # which is what froze it at ~0.96 and produced the deterministic-play gap.
  # Exploration comes from the initial std; exploitation must sharpen the mean.
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.5
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "shirt_distribute"
    experiment_name: ""
    write_interval: 200
    checkpoint_interval: 2000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
# Bounded budget for the first trainable iteration of the (simplified, fixed-pose,
# deterministic-grasp) cloth task — the 11 k-particle PBD cloth caps throughput at
# ~1 s/it, so a full 300 k-step run is infeasible.  Resume from a checkpoint to
# extend if the policy is still improving at the cap.
trainer:
  class: SequentialTrainer
  timesteps: 20000
  environment_info: log
