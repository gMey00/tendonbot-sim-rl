seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True  # R6: required so each model goes through Runner._component()
                  # rather than the shared_model factory (which doesn't know
                  # our CubeSetPolicy/CubeSetValue classes).
  policy:  # R6: DeepSets-encoder Gaussian policy
    class: CubeSetPolicy
    clip_actions: False
    clip_log_std: True
    min_log_std: -2.0
    max_log_std: 2.0
    initial_log_std: 0.0
    # CubeSetLayout descriptor (must match cube_sort_env_cfg.py ObservationsCfg)
    non_set_dim: 34
    set_per_cube_dim: 15
    n_max_cubes: 16
    privileged_dim: 32
  value:  # R6: asymmetric critic — sees the privileged tail
    class: CubeSetValue
    clip_actions: False
    non_set_dim: 34
    set_per_cube_dim: 15
    n_max_cubes: 16
    privileged_dim: 32


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 128
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.995
  lambda: 0.95
  learning_rate: 1.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.004
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.005
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.5
  time_limit_bootstrap: True
  # logging and checkpoint
  experiment:
    directory: "cube_sort"
    experiment_name: ""
    write_interval: 250
    checkpoint_interval: 5000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 800000
  environment_info: log
