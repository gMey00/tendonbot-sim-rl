seed: 43
models:
  separate: false
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -3.0
    max_log_std: 0.5
    initial_log_std: -0.5
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 128
      - 64
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 128
      - 64
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 48
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.0001
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.004
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.5
  time_limit_bootstrap: false
  experiment:
    directory: /home/woody/iwfa/iwfa131h/wt-shirt-present/src/tensegrity_pick/logs/skrl/shirt_present
    experiment_name: 2026-07-08_16-03-46_ppo_torch_seed43
    write_interval: 200
    checkpoint_interval: 2000
trainer:
  class: SequentialTrainer
  timesteps: 120000
  environment_info: log
  close_environment_at_exit: false
